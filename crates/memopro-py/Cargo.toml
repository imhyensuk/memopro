[package]
name = "memopro-py"
description = "Python bindings for the memopro core (built with maturin; not published to crates.io)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
memopro = { path = "../memopro" }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
