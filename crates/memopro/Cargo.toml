[package]
name = "memopro"
description = "Budgeted memory runtime: keep, losslessly compress, re-read from verified source files or recompute large buffers so work runs within a guaranteed memory ceiling (alpha)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["memory", "out-of-core", "compression", "runtime", "deep-learning"]
categories = ["memory-management", "science"]

[dependencies]
libc = "0.2"
rayon = "1.12"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
