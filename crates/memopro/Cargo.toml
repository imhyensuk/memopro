[package]
name = "memopro"
description = "Framework-agnostic memory toolkit for deep learning workloads: memory budgets, tensor compression and spill (early development)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["memory", "deep-learning", "compression", "pytorch"]
categories = ["memory-management", "science"]

[dependencies]
libc = "0.2"
rayon = "1.12"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.14"
