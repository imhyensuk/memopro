[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "memopro"
description = "Run work that exceeds your machine's memory losslessly, within a guaranteed memory ceiling: 16-bit LLM fine-tuning and generation beyond device memory, and a budgeted runtime for large arrays (alpha)."
readme = "README.en.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["memory", "deep-learning", "pytorch", "llm", "lora", "fine-tuning", "out-of-core"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]
torch = ["torch>=2.4", "numpy"]
hf = ["torch>=2.4", "numpy", "transformers", "accelerate", "safetensors"]
llm = ["torch>=2.4", "numpy", "transformers", "accelerate", "safetensors", "peft", "torchao"]
notebook = ["ipython"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
memopro = "memopro.cli:main"

[tool.maturin]
python-source = "python"
module-name = "memopro._core"
manifest-path = "crates/memopro-py/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["memopro", "experiments"]

[tool.ruff.lint.per-file-ignores]
# Research scripts whose SHA-256 is recorded in docs/research/data/*/env.json must not be
# rewritten after they produced results; keep lint exceptions here instead of editing them.
"experiments/**/*.py" = ["SIM115", "UP017"]  # UP017 appeared with target py311 (0026)
"experiments/n1c_demo/*.py" = ["RUF100", "RUF015"]  # frozen after the N1c demo run (0039)

[tool.ruff.format]
# Frozen: experiment scripts are hashed in env.json when they produce results (see above).
exclude = ["experiments/e0*/*.py", "experiments/n1c_demo/*.py"]
