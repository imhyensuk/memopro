name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p memopro

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip maturin pytest ruff
      - name: Install test dependencies (CPU torch on Linux)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install torch
          fi
          python -m pip install numpy ipython transformers accelerate
      - run: ruff check python tests experiments
      - run: maturin build --release --out dist
      - run: python -m pip install --no-index --find-links dist memopro
      - run: pytest -q

  cgroup:
    # hwinfo must report the container memory limit (A1a completion condition, 0035).
    name: Container memory limit (Linux, cgroup v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tests without a memory limit
        run: docker run --rm -v "$PWD":/src -w /src rust:1 cargo test -p memopro --no-run
      - name: Run the ignored cgroup test inside a 512 MiB container
        run: >
          docker run --rm --memory=512m -e MEMOPRO_EXPECT_CGROUP_LIMIT=536870912
          -v "$PWD":/src -w /src rust:1
          cargo test -p memopro -- --ignored cgroup_limit_matches_container
