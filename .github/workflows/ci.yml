name: CI

# Usage policy (docs/research/0043, 0230): pull requests run Linux and macOS (the repository is
# public since 0212, so macOS minutes are free, and the macOS pager must be tested before merge);
# Windows runs once per push to main or on manual dispatch.
# Documentation-only changes skip CI. A newer run on the same ref cancels the older one.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p memopro
      - name: Whole-process budget tests, one at a time (0229)
        run: cargo test -p memopro --lib -- --ignored --test-threads=1 process evicted_chunks
      - run: cargo test -p memopro-c
      - name: C ABI smoke test (include/memopro.h)
        run: |
          cargo build -q -p memopro-c --release
          cc -std=c11 -Wall -Wextra -Werror -o target/mp_smoke crates/memopro-c/tests/smoke.c \
            -Icrates/memopro-c/include -Ltarget/release -lmemopro_c -Wl,-rpath,"$PWD/target/release"
          ./target/mp_smoke
      - name: LD_PRELOAD smoke test (0189)
        run: |
          cargo build -q -p memopro-preload --release
          cc -std=c11 -O1 -Wall -Wextra -Werror -o target/preload_smoke crates/memopro-preload/tests/smoke.c
          LD_PRELOAD="$PWD/target/release/libmemopro_preload.so" MEMOPRO_PRELOAD_BUDGET=67108864 \
            MEMOPRO_PRELOAD_REPORT=target/preload_report.json ./target/preload_smoke
          cat target/preload_report.json
          python3 -c "import json; r = json.load(open('target/preload_report.json')); \
            assert r['paged_allocations'] >= 24 and r['evictions'] > 0 and r['overruns'] == 0, r"

  python:
    name: Python ${{ matrix.python }} (ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip maturin pytest ruff
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy ipython transformers accelerate
      - run: ruff check python tests experiments
      - run: maturin build --release --out dist
      - run: python -m pip install --no-index --find-links dist memopro
      - run: pytest -q -rs

  cgroup:
    # hwinfo must report the container memory limit (A1a completion condition, 0035).
    name: Container memory limit (Linux, cgroup v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tests without a memory limit
        run: docker run --rm -v "$PWD":/src -w /src rust:1 cargo test -p memopro --no-run
      - name: Run the ignored cgroup test inside a 512 MiB container
        run: >
          docker run --rm --memory=512m -e MEMOPRO_EXPECT_CGROUP_LIMIT=536870912
          -v "$PWD":/src -w /src rust:1
          cargo test -p memopro -- --ignored cgroup_limit_matches_container

  macos:
    # One macOS job (Rust tests + Python 3.14), on pull requests too (0230).
    name: macOS (Rust + Python 3.14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p memopro
      - name: Whole-process budget tests, one at a time (0229)
        run: cargo test -p memopro --lib -- --ignored --test-threads=1 process evicted_chunks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip maturin pytest
      - run: python -m pip install torch numpy ipython transformers accelerate
      - run: maturin build --release --out dist
      - run: python -m pip install --no-index --find-links dist memopro
      - run: pytest -q

  windows:
    # Windows spill writes and the Python package (0052 E8), only outside pull requests (0043).
    name: Windows (Rust + Python 3.12)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p memopro
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip maturin pytest
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy ipython transformers accelerate
      - run: maturin build --release --out dist
      - run: python -m pip install --no-index --find-links dist memopro
      - run: pytest -q
