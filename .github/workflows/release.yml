# Release pipeline (0015 P2, 0044).
# Publishing is OUTWARD-FACING and must be triggered deliberately by the maintainer:
#   - PyPI uses Trusted Publishing: register this repository/workflow/environment "pypi" as a
#     (pending) trusted publisher on pypi.org first. No token is stored.
#   - crates.io uses Trusted Publishing too (configured on crates.io after 0.1.0, which was
#     published with a token): rust-lang/crates-io-auth-action exchanges the job's OIDC token
#     for a short-lived publish token. No token is stored.
# Nothing is published unless a version tag (v*) matching the Cargo version is pushed AND the
# "pypi" / "crates-io" environments are approved in GitHub.
#
# Manual run (workflow_dispatch) builds artifacts only and never publishes; by default it builds
# the Linux x86_64 wheel alone (e.g. for the Colab CUDA check), macOS on request (costs 10x).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build the macOS arm64 wheel"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    name: Check tag matches Cargo version
    runs-on: ubuntu-latest
    outputs:
      pep440: ${{ steps.v.outputs.pep440 }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          cargo=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          pep440=$(echo "$cargo" | sed -e 's/-alpha\./a/' -e 's/-beta\./b/' -e 's/-rc\./rc/')
          echo "pep440=$pep440" >> "$GITHUB_OUTPUT"
          echo "Cargo $cargo -> PEP 440 $pep440"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$pep440" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} does not match version $pep440"; exit 1
          fi

  wheel-linux:
    name: Wheel (x86_64-unknown-linux-gnu)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          args: --release --out dist
          manylinux: auto
      - name: Smoke test the wheel in a clean environment (no torch)
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --no-index --find-links dist memopro
          /tmp/smoke/bin/memopro --version
          /tmp/smoke/bin/memopro doctor --no-devices --json > /dev/null
          /tmp/smoke/bin/python -c "import sys, memopro; assert memopro.__version__ == '${{ needs.version.outputs.pep440 }}'; assert 'torch' not in sys.modules"
          /tmp/smoke/bin/python -c "import memopro; s = memopro.enable('512MB!'); print(s); s.disable()"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-x86_64-unknown-linux-gnu
          path: dist

  wheel-linux-arm:
    # Linux on ARM (Jetson, Raspberry Pi 5, Graviton), cross-built in a manylinux image (0230)
    name: Wheel (aarch64-unknown-linux-gnu)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: aarch64-unknown-linux-gnu
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-aarch64-unknown-linux-gnu
          path: dist

  wheel-macos:
    # Separate job so that a plain manual run never starts a (10x billed) macOS runner.
    name: Wheel (aarch64-apple-darwin)
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: aarch64-apple-darwin
          args: --release --out dist
      - name: Smoke test the wheel in a clean environment (no torch)
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --no-index --find-links dist memopro
          /tmp/smoke/bin/memopro --version
          /tmp/smoke/bin/memopro doctor --no-devices --json > /dev/null
          /tmp/smoke/bin/python -c "import sys, memopro; assert memopro.__version__ == '${{ needs.version.outputs.pep440 }}'; assert 'torch' not in sys.modules"
          /tmp/smoke/bin/python -c "import memopro; s = memopro.enable('512MB!'); print(s); s.disable()"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-aarch64-apple-darwin
          path: dist

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish-pypi:
    needs: [wheel-linux, wheel-linux-arm, wheel-macos, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-crates:
    needs: [wheel-linux, wheel-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p memopro
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
